<h4> Agregar personajes</h4>
<form action="" class="row " (ngSubmit)="emitCharacter()">
  <input
    type="text"
    [(ngModel)]="character.name"
    placeholder="Nombre"
    class="form-control mb-2"
    name="name"
    >
  <input
    type="number"
    [(ngModel)]="character.power"
    placeholder="Poder"
    class="form-control mb-2"
    name="power"
    >
  <button class="btn btn-primary" type="submit">Agregar</button>
</form>
